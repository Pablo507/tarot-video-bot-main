name: 🔮 Publicar videos de Tarot en YouTube

on:
  # ⛔ Cron de GitHub DESACTIVADO — usamos cron-job.org
  # schedule:
  #   - cron: "0 9 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — generar sin subir a YouTube"
        type: boolean
        default: false
      private:
        description: "Subir como privado"
        type: boolean
        default: false
      force_group:
        description: "Forzar grupo: auto / 0 / 1 / 2 / 3 / both"
        type: choice
        options:
          - "auto"
          - "0"
          - "1"
          - "2"
          - "3"
          - "both"
        default: "auto"
      force_cta:
        description: "Forzar CTA: none, free, paid — vacío = automático"
        type: choice
        options:
          - ""
          - "none"
          - "free"
          - "paid"
        default: ""

concurrency:
  group: tarot-publish
  cancel-in-progress: false

jobs:
  publicar:
    name: "Grupo ${{ matrix.group }}: ${{ matrix.nombres }}"
    runs-on: ubuntu-latest
    timeout-minutes: 28

    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 0
            nombres: "Aries - Tauro - Géminis"
          - group: 1
            nombres: "Cáncer - Leo - Virgo"
          - group: 2
            nombres: "Libra - Escorpio - Sagitario"
          - group: 3
            nombres: "Capricornio - Acuario - Piscis"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decidir si este grupo corre hoy
        id: check
        run: |
          set -euo pipefail
          DOW=$(date -u +%u)
          FORCE="${{ github.event.inputs.force_group }}"
          GRP="${{ matrix.group }}"

          case "$DOW" in
            1) GRUPO_HOY="0" ;;
            2) GRUPO_HOY="1" ;;
            3) GRUPO_HOY="2" ;;
            4) GRUPO_HOY="3" ;;
            5) GRUPO_HOY="0" ;;
            6) GRUPO_HOY="1" ;;
            7) GRUPO_HOY="2" ;;
            *) GRUPO_HOY="" ;;
          esac

          RUN="false"
          MOTIVO=""

          if [ "$FORCE" = "both" ]; then
            RUN="true"; MOTIVO="forzado both"
          elif [ -n "$FORCE" ] && [ "$FORCE" != "auto" ] && [ "$FORCE" = "$GRP" ]; then
            RUN="true"; MOTIVO="forzado grupo $GRP"
          elif [ -z "$FORCE" ] || [ "$FORCE" = "auto" ]; then
            if [ "$GRP" = "$GRUPO_HOY" ]; then
              RUN="true"; MOTIVO="DOW=$DOW → grupo $GRUPO_HOY"
            else
              MOTIVO="DOW=$DOW no corresponde al grupo $GRP"
            fi
          fi

          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "DOW=$DOW grupo_hoy=$GRUPO_HOY grupo_actual=$GRP force='$FORCE' → $RUN ($MOTIVO)"

      - name: Sistema (ffmpeg + fuentes)
        if: steps.check.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation

      - name: Dependencias Python
        if: steps.check.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Escribir credenciales y .env
        if: steps.check.outputs.run == 'true'
        env:
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_TOKEN_JSON:     ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GOOGLE_TTS_CREDENTIALS: ${{ secrets.GOOGLE_TTS_CREDENTIALS }}
          GROQ_API_KEY:           ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY:         ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$YOUTUBE_CLIENT_SECRETS" > client_secrets.json
          printf '%s' "$YOUTUBE_TOKEN_JSON"     > token.json
          printf '%s' "$GOOGLE_TTS_CREDENTIALS" > tts_credentials.json
          {
            echo "GROQ_API_KEY=$GROQ_API_KEY"
            echo "PEXELS_API_KEY=$PEXELS_API_KEY"
            echo "GOOGLE_APPLICATION_CREDENTIALS=tts_credentials.json"
          } > .env
          sed 's/=.*/=<oculto>/' .env

      - name: Elegir CTA
        id: cta
        if: steps.check.outputs.run == 'true'
        run: |
          set -euo pipefail
          CTA="${{ github.event.inputs.force_cta }}"
          if [ -z "$CTA" ]; then
            DOW=$(date -u +%u)
            case "$DOW" in
              1|3|5) CTA="free" ;;
              *) CTA="paid" ;;
            esac
          fi
          echo "cta=$CTA" >> "$GITHUB_OUTPUT"
          echo "CTA = $CTA"

      - name: Generar y publicar
        if: steps.check.outputs.run == 'true'
        run: |
          set -euo pipefail
          CMD="python pipeline.py --group ${{ matrix.group }} --cta ${{ steps.cta.outputs.cta }}"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && CMD="$CMD --dry-run"
          [ "${{ github.event.inputs.private }}" = "true" ] && CMD="$CMD --private"
          echo "▶️  $CMD"
          eval "$CMD"

      - name: Subir MP4s como artifact (solo en dry-run)
        if: steps.check.outputs.run == 'true' && github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: videos-group-${{ matrix.group }}
          path: output_videos/*.mp4
          retention-days: 7