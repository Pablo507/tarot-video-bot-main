name: 🔮 Publicar videos de Tarot en YouTube

on:
  schedule:
    # Lunes a domingo a las 14:00 UTC (11:00 AM Uruguay)
    - cron: "14 11 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — generar sin subir a YouTube"
        type: boolean
        default: false
      private:
        description: "Subir como privado"
        type: boolean
        default: false
      force_group:
        description: "Forzar grupo: 0 (Aries-Virgo) o 1 (Libra-Piscis) — vacío = automático"
        type: string
        default: ""
      force_cta:
        description: "Forzar CTA: none, free, paid — vacío = automático según día"
        type: string
        default: ""

jobs:

  grupo-A-0:
    name: "Aries - Tauro - Geminis"
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Verificar grupo A (días pares)
        id: check
        run: |
          DAY=$(date -u +%-d)
          MOD=$((DAY % 2))
          FORCE="${{ github.event.inputs.force_group }}"
          if [ "$FORCE" = "0" ] || ([ "$FORCE" = "" ] && [ "$MOD" = "0" ]); then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi
      - name: Sistema
        if: steps.check.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation
      - name: Dependencias
        if: steps.check.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          python -c "import moviepy.video.fx.resize as r, inspect; src=inspect.getfile(r); txt=open(src).read().replace('Image.ANTIALIAS','Image.LANCZOS'); open(src,'w').write(txt)"
      - name: Credenciales
        if: steps.check.outputs.run == 'true'
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS }}' > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}'     > token.json
          echo '${{ secrets.GOOGLE_TTS_CREDENTIALS }}' > tts_credentials.json
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}"                  > .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}"             >> .env
          echo "GOOGLE_APPLICATION_CREDENTIALS=tts_credentials.json"      >> .env
          echo "GOOGLE_TTS_VOICE=es-US-Neural2-A"                         >> .env
      - name: Generar y publicar
        if: steps.check.outputs.run == 'true'
        run: |
          DAY=$(date +%u)  # 1=Lunes, 2=Martes, ...
          CTA="${{ github.event.inputs.force_cta }}"
          if [ "$CTA" = "" ]; then
            CTA="none"
            if [ "$DAY" -eq 2 ]; then
              CTA="free"      # Martes → oferta gratuita
            elif [ "$DAY" -eq 4 ]; then
              CTA="paid"      # Jueves → oferta de pago ($4.99/mes)
            fi
          fi
          
          CMD="python pipeline.py --group 0 --cta $CTA"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && CMD="$CMD --dry-run"
          [ "${{ github.event.inputs.private }}" = "true" ] && CMD="$CMD --private"
          eval $CMD

