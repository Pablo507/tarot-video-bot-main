name: 🔮 Publicar videos de Tarot en YouTube

on:
  # ⛔ Cron de GitHub DESACTIVADO — usamos cron-job.org
  # schedule:
  #   - cron: "0 6 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — generar sin subir a YouTube"
        type: boolean
        default: false
      private:
        description: "Subir como privado"
        type: boolean
        default: false
      force_day:
        description: "Forzar día: wed (0+1) / fri (2+3) / sun (0+1) / all — vacío = automático"
        type: choice
        options:
          - ""
          - "wed"
          - "fri"
          - "sun"
          - "all"
        default: ""
      force_cta:
        description: "Forzar CTA: none, free, paid — vacío = automático"
        type: choice
        options:
          - ""
          - "none"
          - "free"
          - "paid"
        default: ""

concurrency:
  group: tarot-publish
  cancel-in-progress: false

jobs:
  publicar:
    name: "Grupo ${{ matrix.group }}: ${{ matrix.nombres }}"
    runs-on: ubuntu-latest
    timeout-minutes: 28

    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 0
            nombres: "Aries - Tauro - Géminis"
            dias: "3,7"
          - group: 1
            nombres: "Cáncer - Leo - Virgo"
            dias: "3,7"
          - group: 2
            nombres: "Libra - Escorpio - Sagitario"
            dias: "5"
          - group: 3
            nombres: "Capricornio - Acuario - Piscis"
            dias: "5"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decidir si este grupo corre hoy
        id: check
        run: |
          set -euo pipefail
          DOW=$(date -u +%u)
          DIAS="${{ matrix.dias }}"
          FORCE="${{ github.event.inputs.force_day }}"
          GRP="${{ matrix.group }}"

          RUN="false"
          MOTIVO=""

          if [ "$FORCE" = "all" ]; then
            RUN="true"; MOTIVO="forzado all"
          elif [ "$FORCE" = "wed" ] && { [ "$GRP" = "0" ] || [ "$GRP" = "1" ]; }; then
            RUN="true"; MOTIVO="forzado wed"
          elif [ "$FORCE" = "sun" ] && { [ "$GRP" = "0" ] || [ "$GRP" = "1" ]; }; then
            RUN="true"; MOTIVO="forzado sun"
          elif [ "$FORCE" = "fri" ] && { [ "$GRP" = "2" ] || [ "$GRP" = "3" ]; }; then
            RUN="true"; MOTIVO="forzado fri"
          elif [ -z "$FORCE" ] && [[ ",$DIAS," == *",$DOW,"* ]]; then
            RUN="true"; MOTIVO="hoy DOW=$DOW está en [$DIAS]"
          else
            MOTIVO="hoy DOW=$DOW no está en [$DIAS]"
          fi

          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "DOW=$DOW dias='$DIAS' force='$FORCE' grupo=$GRP → $RUN ($MOTIVO)"

      - name: Sistema (ffmpeg + fuentes)
        if: steps.check.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation

      - name: Dependencias Python
        if: steps.check.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Escribir credenciales y .env
        if: steps.check.outputs.run == 'true'
        env:
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_TOKEN_JSON:     ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GOOGLE_TTS_CREDENTIALS: ${{ secrets.GOOGLE_TTS_CREDENTIALS }}
          GROQ_API_KEY:           ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY:         ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$YOUTUBE_CLIENT_SECRETS" > client_secrets.json
          printf '%s' "$YOUTUBE_TOKEN_JSON"     > token.json
          printf '%s' "$GOOGLE_TTS_CREDENTIALS" > tts_credentials.json
          {
            echo "GROQ_API_KEY=$GROQ_API_KEY"
            echo "PEXELS_API_KEY=$PEXELS_API_KEY"
            echo "GOOGLE_APPLICATION_CREDENTIALS=tts_credentials.json"
          } > .env
          sed 's/=.*/=<oculto>/' .env

      - name: Elegir CTA
        id: cta
        if: steps.check.outputs.run == 'true'
        run: |
          set -euo pipefail
          CTA="${{ github.event.inputs.force_cta }}"
          if [ -z "$CTA" ]; then
            DOW=$(date -u +%u)
            case "$DOW" in
              3) CTA="free" ;;
              5) CTA="paid" ;;
              7) CTA="paid" ;;
              *) CTA="paid" ;;
            esac
          fi
          echo "cta=$CTA" >> "$GITHUB_OUTPUT"
          echo "CTA = $CTA"

      - name: Generar y publicar
        if: steps.check.outputs.run == 'true'
        run: |
          set -euo pipefail
          CMD="python pipeline.py --group ${{ matrix.group }} --cta ${{ steps.cta.outputs.cta }}"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && CMD="$CMD --dry-run"
          [ "${{ github.event.inputs.private }}" = "true" ] && CMD="$CMD --private"
          echo "▶️  $CMD"
          eval "$CMD"

      - name: Subir MP4s como artifact (solo en dry-run)
        if: steps.check.outputs.run == 'true' && github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: videos-group-${{ matrix.group }}
          path: output_videos/*.mp4
          retention-days: 7