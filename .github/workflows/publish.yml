name: 🔮 Publicar 12 videos de Tarot en YouTube

on:
  # Todos los días a las 14:00 UTC (11:00 AM Uruguay)
  schedule:
    - cron: "0 14 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — generar sin subir a YouTube"
        type: boolean
        default: false
      private:
        description: "Subir como privado"
        type: boolean
        default: false
      group:
        description: "Solo un grupo (0-3) — vacío = todos"
        type: string
        default: ""

jobs:
  grupo-0:
    name: "Aries - Tauro - Geminis"
    runs-on: ubuntu-latest
    timeout-minutes: 28
    if: ${{ github.event.inputs.group == '' || github.event.inputs.group == '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation
      - name: Dependencias
        run: |
          pip install -r requirements.txt
          python -c "import moviepy.video.fx.resize as r, inspect; src=inspect.getfile(r); txt=open(src).read().replace('Image.ANTIALIAS','Image.LANCZOS'); open(src,'w').write(txt)"
      - name: Credenciales
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS }}' > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}'     > token.json
          echo '${{ secrets.GOOGLE_TTS_CREDENTIALS }}' > tts_credentials.json
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}"                  > .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}"             >> .env
          echo "GOOGLE_APPLICATION_CREDENTIALS=tts_credentials.json"      >> .env
          echo "GOOGLE_TTS_VOICE=es-US-Neural2-A"                         >> .env
      - name: Generar y publicar
        run: |
          CMD="python pipeline.py --group 0"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && CMD="$CMD --dry-run"
          [ "${{ github.event.inputs.private }}" = "true" ] && CMD="$CMD --private"
          eval $CMD

