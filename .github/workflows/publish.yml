name: 🔮 Publicar videos de Tarot en YouTube

on:
  # ⛔ Cron de GitHub DESACTIVADO — usamos cron-job.org
  # schedule:
  #   - cron: "0 6 * * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — generar sin subir a YouTube"
        type: boolean
        default: false
      private:
        description: "Subir como privado"
        type: boolean
        default: false
      force_day:
        description: "Forzar día: wed (grupos 0+1) / sun (grupos 2+3) / both — vacío = automático"
        type: choice
        options:
          - ""
          - "wed"
          - "sun"
          - "both"
        default: ""
      force_cta:
        description: "Forzar CTA: none, free, paid — vacío = automático"
        type: choice
        options:
          - ""
          - "none"
          - "free"
          - "paid"
        default: ""

concurrency:
  group: tarot-publish
  cancel-in-progress: false

jobs:
  publicar:
    name: "Grupo ${{ matrix.group }}: ${{ matrix.nombres }}"
    runs-on: ubuntu-latest
    timeout-minutes: 28

    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 0
            nombres: "Aries - Tauro - Géminis"
            dia: wed
          - group: 1
            nombres: "Cáncer - Leo - Virgo"
            dia: wed
          - group: 2
            nombres: "Libra - Escorpio - Sagitario"
            dia: sun
          - group: 3
            nombres: "Capricornio - Acuario - Piscis"
            dia: sun

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Decidir si este grupo corre hoy
        id: check
        run: |
          set -euo pipefail
          # Día de la semana en UTC: 1=lunes, 2=martes, 3=miércoles,
          # 4=jueves, 5=viernes, 6=sábado, 7=domingo
          DOW=$(date -u +%u)
          FORCE="${{ github.event.inputs.force_day }}"
          DIA_GRUPO="${{ matrix.dia }}"

          # Mapear DOW a "wed" (miércoles=3) o "sun" (domingo=7)
          HOY=""
          if [ "$DOW" -eq 3 ]; then HOY="wed"; fi
          if [ "$DOW" -eq 7 ]; then HOY="sun"; fi

          RUN="false"

          # 1) Forzado manual desde workflow_dispatch
          if [ "$FORCE" = "both" ]; then
            RUN="true"
            echo "→ Forzado: both (correr todo)"
          elif [ -n "$FORCE" ] && [ "$FORCE" = "$DIA_GRUPO" ]; then
            RUN="true"
            echo "→ Forzado: $FORCE = $DIA_GRUPO"
          # 2) Modo automático: solo miércoles o domingo
          elif [ -z "$FORCE" ]; then
            if [ -z "$HOY" ]; then
              RUN="false"
              echo "→ Hoy DOW=$DOW no es miércoles ni domingo → SALTAR"
            elif [ "$HOY" = "$DIA_GRUPO" ]; then
              RUN="true"
              echo "→ Hoy es $HOY y el grupo es $DIA_GRUPO → CORRER"
            else
              RUN="false"
              echo "→ Hoy es $HOY pero el grupo es $DIA_GRUPO → SALTAR"
            fi
          fi

          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo ""
          echo "═══ Resumen decisión ═══"
          echo "DOW (UTC):  $DOW"
          echo "HOY:        ${HOY:-<ninguno>}"
          echo "Grupo día:  $DIA_GRUPO"
          echo "Forzado:    ${FORCE:-<no>}"
          echo "DECISIÓN:   run=$RUN"
          echo "════════════════════════"

      - name: Sistema (ffmpeg + fuentes)
        if: steps.check.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation

      - name: Dependencias Python
        if: steps.check.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Escribir credenciales y .env
        if: steps.check.outputs.run == 'true'
        env:
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_TOKEN_JSON:     ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GOOGLE_TTS_CREDENTIALS: ${{ secrets.GOOGLE_TTS_CREDENTIALS }}
          GROQ_API_KEY:           ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY:         ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$YOUTUBE_CLIENT_SECRETS" > client_secrets.json
          printf '%s' "$YOUTUBE_TOKEN_JSON"     > token.json
          printf '%s' "$GOOGLE_TTS_CREDENTIALS" > tts_credentials.json

          {
            echo "GROQ_API_KEY=$GROQ_API_KEY"
            echo "PEXELS_API_KEY=$PEXELS_API_KEY"
            echo "GOOGLE_APPLICATION_CREDENTIALS=tts_credentials.json"
          } > .env

          echo "── .env generado ──"
          sed 's/=.*/=<oculto>/' .env

      - name: Elegir CTA
        id: cta
        if: steps.check.outputs.run == 'true'
        run: |
          set -euo pipefail
          CTA="${{ github.event.inputs.force_cta }}"
          if [ -z "$CTA" ]; then
            # Miércoles = free, Domingo = paid
            DOW=$(date -u +%u)
            case "$DOW" in
              3) CTA="free" ;;
              7) CTA="paid" ;;
              *) CTA="none" ;;
            esac
          fi
          echo "cta=$CTA" >> "$GITHUB_OUTPUT"
          echo "CTA elegido: $CTA"

      - name: Generar y publicar
        if: steps.check.outputs.run == 'true'
        run: |
          set -euo pipefail
          CMD="python pipeline.py --group ${{ matrix.group }} --cta ${{ steps.cta.outputs.cta }}"
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && CMD="$CMD --dry-run"
          [ "${{ github.event.inputs.private }}" = "true" ] && CMD="$CMD --private"
          echo "▶️  $CMD"
          eval "$CMD"

      - name: Subir MP4s como artifact (solo en dry-run)
        if: steps.check.outputs.run == 'true' && github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: videos-group-${{ matrix.group }}
          path: output_videos/*.mp4
          retention-days: 7

      - name: Aviso si se salteó por día
        if: steps.check.outputs.run != 'true'
        run: |
          echo "⏭️  Este grupo NO se ejecuta hoy."
          echo "   El grupo '${{ matrix.nombres }}' solo corre los días: ${{ matrix.dia }}"
          echo "   Hoy es DOW=$(date -u +%u) (UTC)"
          echo "   Próxima ejecución programada: según calendario."