name: 🔮 Publicar video de Tarot en YouTube

on:
  schedule:
    - cron: "0 14 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — generar video sin subir a YouTube"
        type: boolean
        default: false
      card:
        description: "Forzar carta específica (ej: La Luna)"
        type: string
        default: ""
      private:
        description: "Subir como privado"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 🔧 Instalar sistema — ffmpeg + fuentes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation

      - name: 📦 Instalar dependencias Python
        run: |
          pip install -r requirements.txt
          python -c "import moviepy.video.fx.resize as r, inspect; src=inspect.getfile(r); txt=open(src).read().replace('Image.ANTIALIAS','Image.LANCZOS'); open(src,'w').write(txt); print('Parche OK')"

      - name: 🔑 Configurar credenciales Google (TTS + YouTube)
        run: |
          echo '${{ secrets.YOUTUBE_CLIENT_SECRETS }}' > client_secrets.json
          echo '${{ secrets.YOUTUBE_TOKEN_JSON }}'     > token.json
          echo '${{ secrets.GOOGLE_TTS_CREDENTIALS }}' > tts_credentials.json

      - name: ⚙️ Crear .env desde Secrets
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}"              > .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}"         >> .env
          echo "GOOGLE_APPLICATION_CREDENTIALS=tts_credentials.json"  >> .env
          echo "GOOGLE_TTS_VOICE=es-US-Neural2-A"                     >> .env

      - name: 🎬 Generar y publicar video
        run: |
          CMD="python pipeline.py"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ -n "${{ github.event.inputs.card }}" ]; then
            CMD="$CMD --card \"${{ github.event.inputs.card }}\""
          fi
          if [ "${{ github.event.inputs.private }}" = "true" ]; then
            CMD="$CMD --private"
          fi
          echo "Ejecutando: $CMD"
          eval $CMD

      

      - name: ⚙️ Auto-refrescar token de YouTube en Secrets
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          ORIGINAL_YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python update_secret.py
